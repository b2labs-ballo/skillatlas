name: Daily ingest

# Runs every day at 03:17 UTC and can also be started by hand
# (GitHub > Actions > Daily ingest > Run workflow).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect entries from GitHub and save them to the database
        run: node scripts/ingest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_INGEST_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
